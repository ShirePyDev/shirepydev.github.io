# ============================================================
# Site configuration. Lines marked EDIT need your real values.
# ============================================================

baseURL: "https://shirepydev.github.io/"
locale: "en-us"
title: "Yusuf Khalid Shire"
theme: "PaperMod"

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
enableEmoji: true

pagination:
  pagerSize: 10

minify:
  disableXML: true

outputs:
  home: [HTML, RSS, JSON]   # JSON output powers the built-in search page

markup:
  goldmark:
    renderer:
      unsafe: false
  highlight:
    codeFences: true
    noClasses: false        # use PaperMod's bundled Chroma styles (light + dark)
    lineNos: false
    guessSyntax: false
  tableOfContents:
    startLevel: 2
    endLevel: 3

params:
  env: production
  description: "Research notes by Yusuf Khalid Shire on AI security, AI safety, and AI policy: prompt injection, how defenses fail and how to evaluate them honestly, and what that means for governance. Written while learning it."
  author: "Yusuf Khalid Shire"
  keywords: [AI security, AI safety, AI policy, prompt injection, LLM security, benchmarks, AI governance]
  images: ["og-default.png"]   # fallback social-preview image (static/og-default.png) for posts without a cover

  label:
    text: "Yusuf Khalid Shire"   # header text, top-left

  defaultTheme: auto        # light/dark follows the reader's system
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  ShowFullTextinRSS: true   # feed readers get the whole post
  ShowToc: true
  TocOpen: false
  ShowWordCount: false
  hideSummary: false
  disableSpecial1stPost: true

  cover:
    linkFullImages: true    # click a cover to open it full size
    responsiveImages: true
    hiddenInList: false     # covers show as thumbnails on the post list

  # Home page: short intro at the top, posts listed underneath (PaperMod "home-info" mode).
  homeInfoParams:
    Title: "Yusuf Khalid Shire"
    Content: >
      Master's student at Kookmin University in Seoul, working on AI security, AI safety,
      and the policy questions between them: prompt injection, how defenses fail, how to
      evaluate them honestly, and what those results should mean for the rules we set for
      deployed systems. My first paper, a benchmark for prompt-injection detectors, is in
      IEEE Access (2026).


      I write here to check whether I understand things, and to leave a clearer path
      than the one I found. Explanations of attacks and defenses, notes on papers and
      policy, and build logs from my own projects, including the mistakes.

  # Previous home page layout, kept in case you want it back: set enabled: true
  # and comment out homeInfoParams above.
  # profileMode:
  #   enabled: false
  #   title: "Yusuf"
  #   subtitle: "AI security researcher in training."
  #   buttons:
  #     - name: Posts
  #       url: /posts/
  #     - name: About
  #       url: /about/

  socialIcons:
    - name: github
      url: "https://github.com/ShirePyDev"
    - name: linkedin
      url: "https://www.linkedin.com/in/YOUR-HANDLE/"     # EDIT: your LinkedIn URL
    - name: email
      url: "mailto:khalidshire@kookmin.ac.kr"              # EDIT if you want a different public address
    # - name: googlescholar        # add once a profile exists
    #   url: ""
    - name: rss
      url: "/index.xml"

  fuseOpts:                 # search behavior (defaults are fine)
    isCaseSensitive: false
    shouldSort: true
    minMatchCharLength: 2
    keys: [title, summary, content]

# Menu is deliberately small. Add Tags after ~8 posts, Archive after ~15.
menu:
  main:
    - identifier: posts
      name: Posts
      url: /posts/
      weight: 10
    - identifier: about
      name: About
      url: /about/
      weight: 20
    - identifier: search
      name: Search
      url: /search/
      weight: 30
