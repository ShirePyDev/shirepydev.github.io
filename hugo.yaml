baseURL: "https://yusufkshire.com/"
locale: "en-us"
title: "Yusuf Khalid Shire"
theme: "PaperMod"
copyright: "© 2026 Yusuf Khalid Shire · Text [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/) · Code [MIT](https://github.com/ShirePyDev/shirepydev.github.io/blob/main/LICENSE-CODE)"

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
enableEmoji: true

pagination:
  pagerSize: 10

minify:
  disableXML: true

outputs:
  home: [HTML, RSS, JSON]   # JSON output powers the built-in search page

markup:
  goldmark:
    renderer:
      unsafe: false
  highlight:
    codeFences: true
    noClasses: false        # use PaperMod's bundled Chroma styles (light + dark)
    lineNos: false
    guessSyntax: false
  tableOfContents:
    startLevel: 2
    endLevel: 3

params:
  env: production
  description: "Research notes by Yusuf Khalid Shire on AI security, AI safety, and AI policy: prompt injection, how defenses fail and how to evaluate them honestly, and what that means for governance. Written while learning it."
  author: "Yusuf Khalid Shire"
  keywords: [AI security, AI safety, AI policy, prompt injection, LLM security, benchmarks, AI governance]
  images: ["og-default.png"]

  analytics:
    google:
      SiteVerificationTag: "HM7oAEmRGNW9r5TQ6-WVZNseXy3MMnPOFKtMzoLcl5s"

  label:
    text: "Yusuf Khalid Shire"   

  defaultTheme: auto        
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: false
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  ShowFullTextinRSS: true   
  ShowToc: true
  TocOpen: false
  ShowWordCount: false
  hideAuthor: true          # one-author blog: no name on every post and list entry
  listThumbnails: false     # true = small cover image next to each entry on the homepage and lists
  hideSummary: false
  disableSpecial1stPost: true

  cover:
    linkFullImages: true   
    responsiveImages: true
    hiddenInList: false     


  homeInfoParams:
    Title: "How defenses for language models fail, and how to measure it"
    Content: >
      I'm a Master's student at Kookmin University in Seoul, working on AI security,
      AI safety, and the policy questions between them. I write explanations of attacks
      and defenses and write-ups of my own research, with the code to rerun them.

  socialIcons:
    - name: github
      url: "https://github.com/ShirePyDev"
    - name: linkedin
      url: "https://www.linkedin.com/in/yusufkshire/"
    - name: x
      url: "https://x.com/YusufKShire"
    - name: email
      url: "mailto:khalidshire@kookmin.ac.kr"

    - name: rss
      url: "/index.xml"

  fuseOpts:               
    isCaseSensitive: false
    shouldSort: true
    minMatchCharLength: 2
    keys: [title, summary, content]

menu:
  main:
    - identifier: posts
      name: Posts
      url: /posts/
      weight: 10
    - identifier: about
      name: About
      url: /about/
      weight: 20
    - identifier: search
      name: Search
      url: /search/
      weight: 30
